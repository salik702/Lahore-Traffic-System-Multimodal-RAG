# Configuration for the evaluation pipeline

evaluation:
  # Retriever configuration
  retriever:
    top_k: 10
    intent: "evaluation"

  # Metrics configuration
  metrics:
    precision_k: [1, 3, 5, 10]
    recall_k: [1, 3, 5, 10]
    ndcg_k: [3, 5, 10]

  # Dataset configuration
  dataset:
    easy_samples: 5
    medium_samples: 5
    complex_samples: 2
    out_of_domain_samples: 1
    auto_generate: true

  # Output configuration
  output:
    directory: "evaluation"
    dataset_file: "dataset.json"
    results_file: "evaluation_results.json"
    report_file: "evaluation_report.md"
    detailed_report_file: "detailed_evaluation_report.json"

  # Logging configuration
  logging:
    level: "INFO"
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
    file: "evaluation.log"

  # Performance configuration
  performance:
    max_concurrent_queries: 3
    query_timeout: 300  # seconds
    delay_between_queries: 0.5  # seconds

  # Validation configuration
  validation:
    strict_mode: false
    check_duplicates: true
    required_fields: ["question", "ground_truth_answer", "relevant_document_ids", "relevance_labels"]