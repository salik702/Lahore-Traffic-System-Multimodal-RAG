[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lahore-traffic-evaluation"
version = "1.0.0"
description = "Retriever evaluation system for the Lahore Traffic RAG corpus"
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
keywords = ["rag", "retrieval", "evaluation", "metrics", "search"]

dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.envs.test]
path = "."

[tool.hatch.envs.default]
path = "."

# Scripts for evaluation commands
[project.scripts]
evaluation-create-dataset = "evaluation.commands:create_dataset"
evaluation-validate-dataset = "evaluation.commands:validate_dataset"
evaluation-run = "evaluation.commands:run_evaluation"
evaluation-generate-report = "evaluation.commands:generate_report"
evaluation-all = "evaluation.commands:run_all"