[project]
name = "lahore-traffic-intelligence-backend"
version = "1.0.0"
description = "FastAPI and RAG-Anything backend for Lahore Traffic Intelligence AI"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "pydantic-settings>=2.10.0",
  "python-multipart>=0.0.20",
  "groq>=0.31.0",
  "raganything[text,image]==1.4.1",
  "numpy>=2.2.0",
  "pillow>=11.3.0",
  "pymupdf>=1.26.0",
  "httpx>=0.28.0",
  "ultralytics>=8.3.0",
  "opencv-python-headless>=4.10.0",
  "onnxruntime>=1.30.0",
  "rapidocr-onnxruntime==1.4.4",
  "reportlab>=4.4,<5",
  "sentence-transformers>=5.1,<6",
  "transformers>=4.41,<5",
  "clip",
]

[project.scripts]
ingest-traffic-data = "app.ingestion.ingest:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
clip = { git = "https://github.com/openai/CLIP.git", rev = "d05afc436d78f1c48dc0dbf8e5980a9d471f35f6" }
